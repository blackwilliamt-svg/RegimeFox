# RegimeFox dashboard - nginx front end.
#
# Install to /etc/nginx/sites-available/solbot and symlink into sites-enabled.
# Replace YOUR-SUBDOMAIN.duckdns.org throughout, then run certbot (see
# DEPLOY.md) which will fill in the TLS block automatically.
#
# This server block listens on its own hostname, so it does not collide with the
# freight lead-gen app already running on this droplet.

# Rate-limit the login endpoint at the edge as well as in the app.
limit_req_zone $binary_remote_addr zone=solbot_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-SUBDOMAIN.duckdns.org;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR-SUBDOMAIN.duckdns.org;

    # certbot --nginx fills these in; they are listed so the file is complete.
    # ssl_certificate     /etc/letsencrypt/live/YOUR-SUBDOMAIN.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR-SUBDOMAIN.duckdns.org/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. The app sets this too; setting it here covers error responses that
    # never reach the app.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The dashboard is small; a modest body cap is plenty and blunts abuse.
    client_max_body_size 1m;

    # --- optional defence in depth -------------------------------------
    # Uncomment and set your own address to restrict the dashboard by source IP
    # at the edge, on top of the login + TOTP the app already enforces.
    #
    # NOTE: this also covers /api/optimizer/bundle, so a RunPod monthly-retest
    # worker's address has to be listed here too or its report-back will be
    # refused at the edge before the bearer token is ever checked.
    # allow 203.0.113.4;
    # deny all;

    access_log /var/log/nginx/solbot-access.log;
    error_log  /var/log/nginx/solbot-error.log;

    location /login {
        limit_req zone=solbot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app reads X-Forwarded-For for login rate limiting, so it must be
        # set here or every attempt appears to come from 127.0.0.1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
